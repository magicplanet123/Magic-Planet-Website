<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="32" height="32" fill="#0f172a" rx="6"/>

  <!-- Outer circle (planet) -->
  <circle cx="16" cy="16" r="13" fill="none" stroke="url(#grad1)" stroke-width="1.5" opacity="0.8"/>

  <!-- Inner circle (core) -->
  <circle cx="16" cy="16" r="8" fill="url(#grad1)" opacity="0.6"/>

  <!-- Center dot -->
  <circle cx="16" cy="16" r="3" fill="#ffffff"/>

  <!-- Rotating elements (stylized stars) -->
  <circle cx="20" cy="12" r="1.5" fill="#00d4ff" opacity="0.9"/>
  <circle cx="12" cy="20" r="1.5" fill="#7c3aed" opacity="0.9"/>

  <!-- Text fallback -->
  <text x="16" y="10" font-size="8" font-weight="bold" text-anchor="middle" fill="#00d4ff" letter-spacing="1">MP</text>
</svg>